<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitness Functions Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%2338b488' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='16' cy='8' r='5'/%3E%3Cpath d='M10 24l3-10h6l3 10'/%3E%3Cpath d='M8 27h16'/%3E%3C/svg%3E">
  <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --bg: oklch(0.98 0.003 160);
  --surface: oklch(0.96 0.004 160);
  --surface-hover: oklch(0.91 0.006 160);
  --border: oklch(0.86 0.01 160);
  --text: oklch(0.14 0.005 160);
  --text-muted: oklch(0.42 0.018 160);
  --accent: oklch(0.55 0.19 153);
  --accent-dim: oklch(0.92 0.035 153);
  --accent-deep: oklch(0.38 0.12 153);
  --success: oklch(0.55 0.17 145);
  --warning: oklch(0.68 0.16 82);
  --danger: oklch(0.55 0.18 20);
  --info: oklch(0.55 0.14 245);
  --radius: 16px;
  --radius-sm: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px;
}

.container {
  max-width: 960px;
  margin: 0 auto;
}

.header {
  display: flex;
  align-items: center;
  gap: 28px;
  margin-bottom: 32px;
  justify-content: center;
}

.header-illustration {
  flex-shrink: 0;
  width: 72px;
  height: 115px;
  color: var(--accent);
}

.header-illustration svg {
  width: 100%;
  height: 100%;
}

.header-text {
  text-align: left;
}

.header h1 {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--accent-deep);
  text-wrap: balance;
}

@media (max-width: 560px) {
  .header {
    flex-direction: column;
    gap: 16px;
  }
  .header-text {
    text-align: center;
  }
  .header-illustration {
    width: 56px;
    height: 90px;
  }
}

.subtitle {
  color: var(--text-muted);
  margin-top: 6px;
  font-size: 0.9rem;
}

.cards-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

@media (max-width: 700px) {
  .cards-row {
    grid-template-columns: 1fr;
  }
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.card:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 16px oklch(0.55 0.19 153 / 0.1);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 20px 0;
}

.card-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  color: var(--accent);
}

.card-header h2 {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text);
}

.card-body {
  padding: 18px 20px 22px;
}

.input-group {
  margin-bottom: 14px;
}

.input-group label {
  display: block;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.input-group input[type="text"],
.input-group input[type="number"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s ease;
}

.input-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px oklch(0.55 0.19 153 / 0.15);
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 14px;
}

.slider-row input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  outline: none;
}

.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 1px 4px oklch(0 0 0 / 0.15);
}

.slider-row input[type="range"]::-moz-range-thumb {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: 2px solid var(--bg);
  box-shadow: 0 1px 4px oklch(0 0 0 / 0.15);
}

.slider-row input[type="range"]:active::-webkit-slider-thumb {
  transform: scale(1.25);
  box-shadow: 0 2px 10px oklch(0.55 0.19 153 / 0.35);
}

.slider-row input[type="range"]::-webkit-slider-thumb {
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.slider-row input[type="number"] {
  width: 80px;
  text-align: center;
}

.bmi-result {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 16px;
  padding: 14px;
  background: var(--accent-dim);
  border-radius: var(--radius-sm);
}

.bmi-label {
  font-size: 0.8rem;
  color: var(--accent-deep);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.bmi-value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent-deep);
}

.bmi-category {
  font-size: 0.9rem;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 20px;
}

.bmi-category[data-cat="Underweight"] { background: oklch(0.55 0.14 245 / 0.18); color: var(--info); }
.bmi-category[data-cat="Normal weight"] { background: oklch(0.55 0.17 145 / 0.18); color: var(--success); }
.bmi-category[data-cat="Overweight"] { background: oklch(0.68 0.16 82 / 0.22); color: var(--warning); }
.bmi-category[data-cat="Obese"] { background: oklch(0.55 0.18 20 / 0.18); color: var(--danger); }

.ring-container {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}

.ring-wrapper {
  position: relative;
  width: 160px;
  height: 160px;
  user-select: none;
  -webkit-user-select: none;
}

.progress-ring {
  width: 100%;
  height: 100%;
  display: block;
}

.ring-track {
  fill: none;
  stroke: var(--border);
  stroke-width: 10;
}

.ring-fill {
  fill: none;
  stroke: var(--accent);
  stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 502.654;
  stroke-dashoffset: 502.654;
  transform: rotate(-90deg);
  transform-origin: 100px 100px;
  transition: stroke-dashoffset 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.ring-handle {
  fill: var(--accent);
  stroke: var(--surface);
  stroke-width: 3;
  cursor: grab;
  transition: r 0.15s ease;
}

.ring-handle:active {
  cursor: grabbing;
}

.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.progress-text {
  font-size: 2rem;
  font-weight: 700;
  color: var(--accent-deep);
  line-height: 1.1;
}

.progress-subtext {
  font-size: 0.75rem;
  color: var(--text-muted);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .ring-fill {
    transition: none;
  }
  .card {
    transition: none;
  }
  .input-group input {
    transition: none;
  }
  * {
    animation-duration: 0s !important;
    transition-duration: 0s !important;
  }
}

.profile-inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 20px;
}

.profile-output {
  margin-top: 18px;
  padding: 14px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.6;
}

.profile-field {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
}

.profile-field + .profile-field {
  border-top: 1px solid var(--border);
}

.profile-field-label {
  color: var(--text-muted);
  font-size: 0.82rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.profile-field-value {
  color: var(--text);
  font-size: 0.95rem;
  font-weight: 600;
}

.profile-bmi-cat {
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--text-muted);
}

.footer {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.75rem;
  margin-top: 32px;
  padding-bottom: 20px;
}
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-illustration">
        <svg viewBox="0 0 100 160" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="22" r="11" stroke="currentColor" stroke-width="2.2"/>
          <path d="M32 52c-7 9-12 18-7 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M68 52c7 9 12 18 7 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M36 48v62" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M64 48v62" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M50 34v78" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M34 112l-12 34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M66 112l12 34" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M8 20v128" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.6"/>
          <line x1="4" y1="20" x2="12" y2="20" stroke="var(--accent)" stroke-width="1.2"/>

        <h1>Fitness Functions Dashboard</h1>

    <div class="cards-row">
      <div class="card" id="bmi-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="2" width="18" height="20" rx="2"/>
            <line x1="7" y1="8" x2="17" y2="8"/>

    <div class="card" id="profile-card">

            <circle cx="12" cy="7" r="4"/>

  <script>
    var Module = {
      onRuntimeInitialized: function () {
        initUI();
      }
    };
  </script>
  <script>
/*
 * =============================================================================
 * C++ FUNCTION PARALLELS (src/fitness-ui.cpp -> Module.* in JavaScript)
 * =============================================================================
 *
 * Module.BMI(h, w)           → BMI()              src/fitness-ui.cpp:13-16
 *   float BMI(float height, float weight) {
 *       return weight / pow(height, 2.0);
 *   }
 *
 * Module.bmi_category(bmi)   → bmi_category()     src/fitness-ui.cpp:38-43
 *   std::string bmi_category(float bmi) {
 *       if (bmi < 18.5) return "Underweight";
 *       if (bmi < 25.0) return "Normal weight";
 *       if (bmi < 30.0) return "Overweight";
 *       return "Obese";
 *   }
 *
 * Module.check_progress(s, g) → check_progress()  src/fitness-ui.cpp:33-36
 *   float check_progress(int steps, int goal) {
 *       return (float)steps / (float)goal;
 *   }
 *
 * Module.get_profile(n, a, h, w) → get_profile()  src/fitness-ui.cpp:18-31
 *   std::string get_profile(std::string name, int age,
 *                           float height, float weight) { ... }
 *
 * All 4 functions are exposed via EMSCRIPTEN_BINDINGS(fitness) at line 45-50
 * Compiled with: emcc -lembind src/fitness-ui.cpp -o fitness.js -sSINGLE_FILE
 * =============================================================================
 */

function initUI() {
  var heightSlider = document.getElementById('height-slider');
  var heightInput  = document.getElementById('height-input');
  var weightSlider = document.getElementById('weight-slider');
  var weightInput  = document.getElementById('weight-input');
  var bmiValue     = document.getElementById('bmi-value');
  var bmiCategory  = document.getElementById('bmi-category');

  var stepsInput   = document.getElementById('steps-input');
  var goalInput    = document.getElementById('goal-input');
  var ringFill     = document.getElementById('ring-fill');
  var ringHandle   = document.getElementById('ring-handle');
  var ringWrapper  = document.getElementById('ring-wrapper');
  var progressText = document.getElementById('progress-text');

  var nameInput      = document.getElementById('name-input');
  var ageInput       = document.getElementById('age-input');
  var profileHeight  = document.getElementById('profile-height');
  var profileWeight  = document.getElementById('profile-weight');
  var profileOutput  = document.getElementById('profile-output');

  function updateBMI() {
    var h = parseFloat(heightInput.value) || 1.70;
    var w = parseFloat(weightInput.value) || 61.23;
    var bmi = Module.BMI(h, w);           // → BMI()            in fitness-ui.cpp:13
    var cat = Module.bmi_category(bmi);   // → bmi_category()   in fitness-ui.cpp:38

    bmiValue.textContent = bmi.toFixed(1);
    bmiCategory.textContent = cat;
    bmiCategory.setAttribute('data-cat', cat);
  }

  var RING_RADIUS = 80;
  var RING_CX = 100;
  var RING_CY = 100;
  var CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;

  function fractionToOffset(f) {
    return CIRCUMFERENCE * (1 - f);
  }

  function fractionToHandle(f) {
    var angle = f * 2 * Math.PI;
    return {
      x: RING_CX + RING_RADIUS * Math.sin(angle),
      y: RING_CY - RING_RADIUS * Math.cos(angle)
    };
  }

  function setRing(fraction) {
    ringFill.style.strokeDashoffset = fractionToOffset(fraction);
    var pos = fractionToHandle(fraction);
    ringHandle.setAttribute('cx', pos.x.toFixed(1));
    ringHandle.setAttribute('cy', pos.y.toFixed(1));
    var displayPct = (fraction * 100).toFixed(1);
    progressText.textContent = displayPct + '%';
  }

  function updateSteps() {
    var steps = parseInt(stepsInput.value) || 0;
    var goal = parseInt(goalInput.value) || 1;
    var pct = Module.check_progress(steps, goal); // → check_progress() in fitness-ui.cpp:33
    var clamped = Math.min(1, Math.max(0, pct));
    setRing(clamped);
  }

  function pointerToFraction(e) {
    var rect = ringWrapper.getBoundingClientRect();
    var scaleX = 200 / rect.width;
    var scaleY = 200 / rect.height;
    var clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var rx = (clientX - rect.left) * scaleX;
    var ry = (clientY - rect.top) * scaleY;
    var dx = rx - RING_CX;
    var dy = RING_CY - ry;
    var angle = Math.atan2(dx, dy);
    if (angle < 0) angle += 2 * Math.PI;
    return angle / (2 * Math.PI);
  }

  var dragging = false;

  function onDragStart(e) {
    e.preventDefault();
    dragging = true;
    ringHandle.setAttribute('r', '10');
  }

  function onDragMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var fraction = pointerToFraction(e);
    var goal = parseInt(goalInput.value) || 1;
    var steps = Math.round(fraction * goal);
    if (steps < 0) steps = 0;
    if (steps > goal) steps = goal;
    stepsInput.value = steps;
    setRing(Module.check_progress(steps, goal)); // → check_progress() in fitness-ui.cpp:33
  }

  function onDragEnd() {
    if (!dragging) return;
    dragging = false;
    ringHandle.setAttribute('r', '8');
  }

  ringHandle.addEventListener('mousedown', onDragStart);
  ringHandle.addEventListener('touchstart', onDragStart, { passive: false });
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('mouseup', onDragEnd);
  document.addEventListener('touchend', onDragEnd);

  function updateProfile() {
    var name = nameInput.value || 'Garvin Yu';
    var age  = parseInt(ageInput.value) || 18;
    var h    = parseFloat(profileHeight.value) || 1.70;
    var w    = parseFloat(profileWeight.value) || 61.23;

    var report = Module.get_profile(name, age, h, w); // → get_profile() in fitness-ui.cpp:18
    var lines  = report.split('\n').filter(function (l) { return l.trim(); });
    var fields = {};
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^(.+?):\s*(.+)$/);
      if (m) fields[m[1].trim()] = m[2].trim();
    }
    var bmiPart = (fields['BMI'] || '--').match(/^([\d.]+)\s*\((.+)\)$/);
    var bmiNum  = bmiPart ? bmiPart[1] : fields['BMI'] || '--';
    var bmiCat  = bmiPart ? bmiPart[2] : '';

    profileOutput.innerHTML =
      '<div class="profile-field"><span class="profile-field-label">Name</span><span class="profile-field-value">' + (fields['Name'] || name) + '</span></div>' +

  // Compiler settings do not allow exiting the runtime, so flushing
  // the streams is not possible. but in ASSERTIONS mode we check
  // if there was something to flush, and if so tell the user they
  // should request that the runtime be exitable.

  // builds we do so just for this check, and here we see if there is any

  // mode (which has its own special function for this; otherwise, all
  // the code is inside libc)
